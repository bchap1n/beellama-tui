# beellama-tui app configuration.
beellama_repo: ${BEELLAMA_REPO}        # env var: path to the beellama checkout
model_roots: ${BEELLAMA_MODEL_ROOTS}   # env var: ;-separated model directories
server:
  host: 127.0.0.1
  port: 8082
configs_dir: configs
gpu_power_limit_watts: 280   # powerlimit task only; baked in by the installer, not read at TUI start
gpu_clock_mhz: 0             # powerlimit task -Clock; 0 = unlocked. Not read at TUI start
benchmark:
  runs: 3
  max_tokens: 4096
  warmup_runs: 3
  warmup_tokens: 256
  cooldown_sec: 0
  config_cooldown_sec: 60
  retries: 2
  timeout_sec: 180
