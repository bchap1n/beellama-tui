# harness-hub Qwen3.8-27B-pi PEFT LoRA (637 MB) on turboderp EXL3 4.00bpw.
# Needs the patched exllamav3 serving kit: serve_openai.py --lora reads LORA_DIR,
# which start.ps1 forwards from this config's env block. GGUF LoRA path does not apply here.
# Think med is the TUI default: the kit fixes reasoning in tools/serve_openai.py and
# does not read NO_THINKING (see qwen38-exl3-35bpw-mtp.yaml); these keys record the default.
# VRAM MEASURED 2026-11-17 on the 3090 at 196608 ctx: 1265 MiB free after load,
# with 3696 MiB already used by the desktop. Log: 512 tensors loaded, no unmatched-key warning;
# required tool call PASS; 27 completion tokens in 4.1 s wall (incl. 308-token prefill).
name: qwen38-exl3-pi-adapted-400bpw-mtp-maxctx
label: Qwen3.8-27B EXL3 4.00bpw + pi LoRA (PEFT)
description: pi PEFT LoRA on EXL3 4.00bpw, 192K nvfp4 KV, MTP, think med
tags: [exl3, lora, maxctx]
build: exllamav3
model:
  dir: "${BEELLAMA_MODELS}/exl3/turboderp/Qwen3.8-27B-exl3-SCP_4.00bpw"
  provider: turboderp
ctx_size: 196608
cache_quant: nvfp4
draft_mode: mtp
port: 8082
reasoning: true
reasoning_effort: medium
env:
  NO_THINKING: "1"
  LORA_DIR: 'D:\.lmstudio\models\harness-hub\Qwen3.8-27B-pi-adapted'
max_tokens: 12288
