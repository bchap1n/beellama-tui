# turboderp SCP 4.00bpw EXL3 target, no draft. The checkpoint carries vision
# tensors and a seven-step MTP head; this base config uses neither so the A/B
# baseline is plain decode. Ladder source: first rung, re-probe on this box.
name: qwen38-exl3-400bpw-turboderp
label: Qwen3.8-27B turboderp EXL3 4.00bpw
description: 128K nvfp4 KV, no draft, turboderp SCP 4.00bpw target
tags: [exl3]
build: exllamav3
model:
  dir: "${BEELLAMA_MODELS}/exl3/turboderp/Qwen3.8-27B-exl3-SCP_4.00bpw"
  provider: turboderp
ctx_size: 131072
cache_quant: nvfp4
draft_mode: none
port: 8082
reasoning: true
reasoning_effort: medium
env:
  NO_THINKING: "1"
