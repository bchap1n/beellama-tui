# turboderp SCP 5.00bpw EXL3 target; the built-in MTP head is shadowed by the
# HermiHg 4.4bpw mixed-precision MTP sidecar (mtp-4.4bpw.safetensors in the
# model dir, 39 tensors replaced). Measured 2026-11-17 on the 3090 with a
# 4.1 GiB desktop and MTP on, nvfp4 KV: 18.2 GiB of weights leaves ~6 GiB for
# everything else, so this is the largest nvfp4 rung that keeps a margin.
#   49152 -> load 23,301 / 1,022 MiB free; 48,663-token prefill leaves 1,135 MiB
#   65536 -> load 23,516 /   807 MiB free; same prefill leaves 341 MiB (no slack)
# Decode min over three back-to-back 300-token runs: 8.18 s (36.7 tok/s; the
# first request after load absorbs graph compile). For a 65,536-token window
# use the -maxctx-kv3 sibling, which trades KV precision for the extra context.
name: qwen38-exl3-500bpw-turboderp-mtp-maxctx
label: Qwen3.8-27B turboderp EXL3 5.00bpw MTP MaxCtx
description: 48K nvfp4 KV, MTP head via 4.4bpw sidecar, ~1 GiB margin
tags: [exl3, mtp, maxctx]
build: exllamav3
model:
  dir: "${BEELLAMA_MODELS}/exl3/turboderp/Qwen3.8-27B-exl3-SCP_5.00bpw"
  provider: turboderp
ctx_size: 49152
cache_quant: nvfp4
draft_mode: mtp
port: 8082
reasoning: true
reasoning_effort: medium
env:
  NO_THINKING: "1"
