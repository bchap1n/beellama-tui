# 147K ctx, q8_0 KV (quality floor), b2048/ub256, think ON low, vision OFF, MTP
#
# Qwen3.8-27B UD-Q3_K_XL (Unsloth Dynamic) — 12.24 GiB, the headroom tier.
# Smallest of the Q3.8 family, so it buys context WITHOUT leaving the q8 KV
# quality floor (hybrid Qwen3.8 is KV-sensitive; q8 is the documented floor).
# VRAM budget on 24 GB: 12.24 model + ~9.9 q8 KV @147K + 0.5 ≈ 22.7 GiB steady,
# ~1.3 GiB absorbs the -b 2048 prefill spike. Do NOT raise past 147456 on q8:
#   163840 lands ~24.2 GiB steady — the documented cliff.
# MTP head verified baked in (nextn tensors): --spec-type draft-mtp n=2.
# think ON (low) + vision OFF: --reasoning on, preserve_thinking:true +
# reasoning_effort:low via chat-template-kwargs. Sampling per unsloth card.
name: qwen38-ud-q3kxl-mtp-maxctx-think
label: Qwen3.8-27B UD-Q3_K_XL MTP MaxCtx Think
description: 147K q8_0 KV (max quality floor), think on low, MTP n=2, 12.2 GiB model
tags: [quality, maxctx]
build: beellama
model: { gguf: "D:/.lmstudio/models/unsloth/qwen3.8-27B-gguf/Qwen3.8-27B-UD-Q3_K_XL.gguf" }
spec: { type: draft-mtp, draft_max: 2 }
ctx_size: 147456
batch: 2048
ubatch: 256
cache_k: q8_0
cache_v: q8_0
reasoning: true
reasoning_effort: low
sampling: { temp: 0.7, top_p: 0.80, top_k: 20, min_p: 0.0, presence_penalty: 1.5, repeat_penalty: 1.0 }
extra_args: ["--cache-ram", "0", "--no-warmup", "--log-timestamps", "--log-prefix"]
