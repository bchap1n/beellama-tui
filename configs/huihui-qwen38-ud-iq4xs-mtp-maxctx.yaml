# 262K ctx (native max), kvarn4 K / kvarn3 V + 1024-token exact tail,
# b2048/ub256, think ON (medium), MTP n=4
#
# Huihui abliterated tune of Qwen3.8-27B UD-IQ4_XS -- same arch, same quant,
# +0.14 GiB weights over the unsloth file (14.40 vs 14.25 GiB on disk).
# Verified live at 262K: model loaded + served with draft acceptance 0.90
# (MTP n=4), ~390 MiB free on a busy GPU (~7.5 GiB of other consumers) --
# zero margin in busy sessions; expect ~2.5 GiB free on a quiet GPU
# (same-size unsloth sibling measured 2.6). Busy session = drop ctx or wait.
#
# --reasoning-budget caps hidden thinking at 8192 tokens (sampler-level).
# Raise it, do not remove it.
name: huihui-qwen38-ud-iq4xs-mtp-maxctx
label: Huihui Qwen3.8-27B Abliterated UD-IQ4_XS MTP MaxCtx
description: 262K kvarn KV (native max), think on (medium), MTP n=4
tags: [maxctx]
build: beellama
model: { gguf: "${BEELLAMA_MODELS}/huihui/Huihui-Qwen3.8-27B-abliterated-UD-IQ4_XS.gguf" }
spec: { type: draft-mtp, draft_max: 4 }
ctx_size: 262144
batch: 2048
ubatch: 256
cache_k: kvarn4
cache_v: kvarn3
kv_tail_tokens: 1024
reasoning: true
reasoning_effort: medium
sampling: { temp: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 0.0, repeat_penalty: 1.0 }
extra_args: ["--reasoning-budget", "8192", "--cache-ram", "0", "--no-warmup", "--log-timestamps", "--log-prefix"]
max_tokens: 12288
