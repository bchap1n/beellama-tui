# 131K ctx, q4_0 KV, think ON - user-selected thinking mode. Qwen3.8 spends
# ~4K tokens of CoT before any code, so bench max_tokens is raised to 12288;
# at the global 4096 every prompt truncates and grades F on empty content.
name: qwen38-ud-q4km-mtp
label: Qwen3.8-27B UD-Q4_K_M MTP
description: 131K q4_0 KV, b4096/ub512, think on, MTP n=2, bench max_tokens 12288
build: beellama
model: { gguf: "D:/.lmstudio/models/unsloth/qwen3.8-27B-gguf/Qwen3.8-27B-UD-Q4_K_M.gguf" }
spec: { type: draft-mtp, draft_max: 2 }
ctx_size: 131072
batch: 4096
ubatch: 512
cache_k: q4_0
cache_v: q4_0
kv_tail_tokens: 1024
reasoning: true
reasoning_effort: medium
sampling: { temp: 0.7, top_p: 0.80, top_k: 20, min_p: 0.0, presence_penalty: 1.5, repeat_penalty: 1.0 }
extra_args: ["--cache-ram", "0", "--no-warmup", "--log-timestamps", "--log-prefix"]
max_tokens: 12288
