# harness-hub Qwen3.8-27B-pi LoRA (GRPO-trained inside pi; omp is pi-derived) on UD-IQ4_XS.
# SUPERSEDED for quality runs by qwen38-pi-merged-iq4xs-mtp-quality (2026-11-18):
# runtime --lora costs +25% per MTP verify cycle and the KVarN cache costs -13% decode
# vs q8_0. Keep this config only for the 192K window tradeoff.
# Adapter 304 MiB F16, applied with --lora; base weights are NOT modified.
# Card: thinking OFF ("the adapter was never trained with it"), temp 0.7.
# Q8_0 is the card's preferred base but does not fit 24 GB; IQ4_XS is the chosen target.
# exllamav3 has PEFT LoRA in-library but serve_openai.py needs a --lora flag (see that patch);
# this config uses llama-server's GGUF LoRA path.
#
# VRAM MEASURED 2026-11-17 on the 3090 at 196608 ctx + MTP + LoRA: 1612 MiB free
# after load, with 4204 MiB already used by the desktop. Tool call PASS, MTP 20/24
# accepted, 51.7 tok/s vs 33.8 tok/s without MTP on the same prompt (MTP kept).
# 262144 was not probed; drop to 131072 if desktop drift OOMs.
name: qwen38-pi-lora-iq4xs-maxctx
label: Qwen3.8-27B pi-LoRA UD-IQ4_XS maxctx
description: harness-hub pi LoRA on UD-IQ4_XS, 192K kvarn KV, think off, vision off, MTP n=4
tags: [maxctx]
build: beellama
model: { gguf: "${BEELLAMA_MODELS}/unsloth/qwen3.8-27B-gguf/Qwen3.8-27B-UD-IQ4_XS.gguf" }
spec: { type: draft-mtp, draft_max: 4 }
ctx_size: 196608
batch: 2048
ubatch: 256
cache_k: kvarn4
cache_v: kvarn3
kv_tail_tokens: 1024
reasoning: false
sampling: { temp: 0.7, top_p: 0.80, top_k: 20, min_p: 0.0, presence_penalty: 1.5, repeat_penalty: 1.0 }
extra_args: ["--lora", "${BEELLAMA_MODELS}/harness-hub/Qwen3.8-27B-pi-GGUF/Qwen3.8-27B-pi-lora-F16.gguf", "--cache-ram", "0", "--no-warmup", "--log-timestamps", "--log-prefix"]
max_tokens: 12288
