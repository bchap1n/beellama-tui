# turboderp SCP 4.00bpw + its own MTP head. The kit launcher forwards
# DRAFT=mtp as --draft_model mtp; the 39 mtp.* tensors live in the target
# shards, so no draft dir is needed. Ladder source: first rung, re-probe.
name: qwen38-exl3-400bpw-turboderp-mtp
label: Qwen3.8-27B turboderp EXL3 4.00bpw MTP
description: 128K nvfp4 KV, built-in MTP head via exllamav3 kit
tags: [exl3, mtp]
build: exllamav3
model:
  dir: "${BEELLAMA_MODELS}/exl3/turboderp/Qwen3.8-27B-exl3-SCP_4.00bpw"
  provider: turboderp
ctx_size: 131072
cache_quant: nvfp4
draft_mode: mtp
port: 8082
reasoning: true
reasoning_effort: medium
env:
  NO_THINKING: "1"
